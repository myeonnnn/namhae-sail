<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Namhae Sail 컨트롤러</title>
    <meta name="theme-color" content="#0b1a2a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <main class="pad">
      <section class="left">
        <div id="status" class="status" data-status="connecting">연결 중</div>
        <p id="link-notice" class="notice" hidden></p>
        <button id="zero" type="button">영점</button>
        <button id="neutral" type="button">중립</button>
      </section>
      <section class="center">
        <div class="label">타 <output id="rudder-value">0%</output></div>
        <div class="wheel" aria-hidden="true"><div id="wheel-spoke" class="spoke"></div></div>
        <div class="rudder-bar" aria-hidden="true"><div id="rudder-fill" class="fill"></div></div>
        <button id="enable-tilt" type="button" hidden>기울기 사용</button>
        <p id="tilt-hint" class="hint">핸드폰을 핸들처럼 돌려서 조타합니다.</p>
      </section>
      <section class="right">
        <div class="label">스로틀 <output id="throttle-value">0%</output></div>
        <div
          id="throttle"
          class="track"
          role="slider"
          aria-label="스로틀"
          aria-valuemin="-100"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div class="center-line"></div>
          <div class="thumb"></div>
        </div>
      </section>
    </main>
    <div class="rotate-notice">핸드폰을 가로로 돌려 주세요.</div>
    <script type="module" src="/src/controller/controller.ts"></script>
  </body>
</html>
