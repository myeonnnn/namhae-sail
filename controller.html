<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Namhae Sail 컨트롤러</title>
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <main class="pad">
      <section class="left">
        <div class="link">
          <div id="status" class="status" data-status="connecting">연결 중</div>
          <p id="link-notice" class="notice" hidden></p>
        </div>
        <button id="menu-open" class="action menu-open" type="button">
          <span class="glyph" aria-hidden="true">☰</span>
          <span class="caption">메뉴</span>
        </button>
        <div id="view-pad" class="view-pad">
          <span class="view-pad-label">끌어서 시점 돌리기</span>
          <button id="view-reset" class="view-reset" type="button">시점 초기화</button>
        </div>
      </section>

      <section class="center">
        <div id="race-info" class="race-info" hidden></div>
        <div class="readout">
          <span class="readout-label">타</span>
          <output id="rudder-value">0%</output>
        </div>
        <div class="wheel" aria-hidden="true">
          <div id="wheel-rim" class="wheel-rim">
            <div class="spoke horizontal"></div>
            <div class="spoke vertical"></div>
            <div class="hub"></div>
            <div class="marker"></div>
          </div>
        </div>
        <div class="rudder-bar" aria-hidden="true">
          <div id="rudder-fill" class="fill"></div>
        </div>
        <button id="enable-tilt" class="enable-tilt" type="button" hidden>기울기 사용</button>
        <p id="tilt-hint" class="hint">핸드폰을 핸들처럼 돌려서 조타합니다.</p>
        <button id="neutral" class="action neutral" type="button">스로틀 중립</button>
      </section>

      <section class="right">
        <div class="throttle-buttons">
          <button id="throttle-up" class="action throttle-up" type="button" aria-label="스로틀 올림">
            <span class="glyph" aria-hidden="true">▲</span>
          </button>
          <div class="readout">
            <span class="readout-label">스로틀</span>
            <output id="throttle-value">—</output>
          </div>
          <button id="throttle-down" class="action throttle-down" type="button" aria-label="스로틀 내림">
            <span class="glyph" aria-hidden="true">▼</span>
          </button>
        </div>
        <div class="gauge" aria-hidden="true">
          <div class="gauge-center"></div>
          <div id="gauge-fill" class="gauge-fill"></div>
        </div>
      </section>
      <div id="countdown" class="countdown" aria-live="polite" hidden></div>
      <!-- 복구 버튼은 배가 전복되었을 때만 떠오른다. 평소에는 자리를 차지하지 않는다. -->
      <button id="reset" class="action reset" type="button" aria-label="복구" hidden>
        <span class="glyph" aria-hidden="true">↻</span>
        <span class="caption">복구</span>
      </button>
    </main>
    <!-- 조종 화면이 아닐 때(연결 대기, 불러오는 중, 시작, 결과, 메뉴) 조종 화면을 덮는다. 내용은 상황에 따라 스크립트가 채운다. -->
    <section id="overlay" class="overlay" hidden></section>
    <div class="rotate-notice">핸드폰을 가로로 돌려 주세요.</div>
    <script type="module" src="/src/controller/controller.ts"></script>
  </body>
</html>
